<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js 指令選擇題測驗</title>
  <!-- 載入 Google Fonts：中文使用 LXGW WenKai Mono TC，英數使用 Bitcount Ink -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=LXGW+WenKai+Mono+TC&display=swap" rel="stylesheet">
  <style>
    /* 讓網頁與畫布填滿瀏覽器視窗 */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f7fa; }
    /* 移除 p5.js 畫布下方的預設空白 */
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- 載入 p5.js 函式庫 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
  <!-- 載入本專案的測驗程式 -->
  <script src="sketch.js"></script>
</body>
</html>
